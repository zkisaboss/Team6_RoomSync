{% extends 'base.html' %}
{% block title %}Login{% endblock %}

{% block content %}
<div class="card" style="max-width: 400px; margin: 4rem auto;">
    <h2 class="text-center">Welcome Back</h2>

    <form method="POST">
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required autofocus>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
        </div>

        <button type="submit" style="width: 100%;">Login</button>
    </form>

    <!-- Social Login Divider -->
    <div class="social-divider">
        <span>or continue with</span>
    </div>

    <!-- Google Sign-In -->
    <div class="social-buttons">
        <button type="button" class="btn-social btn-google" id="google-signin-btn">
            <svg viewBox="0 0 24 24" width="20" height="20">
                <path fill="#4285F4"
                    d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.27-4.74 3.27-8.1z" />
                <path fill="#34A853"
                    d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                <path fill="#FBBC05"
                    d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
                <path fill="#EA4335"
                    d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
            </svg>
            Continue with Google
        </button>
    </div>

    <p class="text-center mt-2">
        Don't have an account? <a href="{{ url_for('register') }}" class="link">Register</a>
    </p>
</div>

<!-- Google Identity Services SDK -->
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
    var googleClientId = '{{ google_client_id }}';

    // Wait for the GIS SDK to finish loading before allowing clicks
    function waitForGoogle(callback, attempts) {
        attempts = attempts || 0;
        if (typeof google !== 'undefined' && google.accounts && google.accounts.id) {
            callback();
        } else if (attempts < 20) {
            setTimeout(function () { waitForGoogle(callback, attempts + 1); }, 250);
        } else {
            alert('Google Sign-In failed to load. Please refresh and try again.');
        }
    }

    // POST the credential token back to Flask
    function handleGoogleCredential(response) {
        var form = document.createElement('form');
        form.method = 'POST';
        form.action = '{{ url_for("auth_google") }}';
        var input = document.createElement('input');
        input.type = 'hidden';
        input.name = 'credential';
        input.value = response.credential;
        form.appendChild(input);
        document.body.appendChild(form);
        form.submit();
    }

    document.getElementById('google-signin-btn').addEventListener('click', function () {
        waitForGoogle(function () {
            // ux_mode: 'popup' prevents the gsi/transform blank-page redirect issue
            google.accounts.id.initialize({
                client_id: googleClientId,
                callback: handleGoogleCredential,
                ux_mode: 'popup',
                auto_select: false,
                cancel_on_tap_outside: true,
            });

            google.accounts.id.prompt(function (notification) {
                // One Tap was suppressed — show a fallback modal with the rendered button
                if (notification.isNotDisplayed() || notification.isSkippedMoment()) {
                    showGoogleButtonModal();
                }
            });
        });
    });

    function showGoogleButtonModal() {
        var existing = document.getElementById('google-modal-overlay');
        if (existing) existing.remove();

        var overlay = document.createElement('div');
        overlay.id = 'google-modal-overlay';
        overlay.style.cssText = [
            'position:fixed', 'top:0', 'left:0', 'width:100%', 'height:100%',
            'background:rgba(0,0,0,0.5)', 'z-index:9999',
            'display:flex', 'align-items:center', 'justify-content:center'
        ].join(';');

        var container = document.createElement('div');
        container.style.cssText = [
            'background:white', 'padding:2rem', 'border-radius:16px',
            'box-shadow:0 8px 32px rgba(0,0,0,0.3)', 'min-width:280px', 'text-align:center'
        ].join(';');

        var title = document.createElement('p');
        title.textContent = 'Sign in with Google';
        title.style.cssText = 'margin:0 0 1rem;font-weight:600;color:#333;font-size:1rem;';
        container.appendChild(title);

        var btnDiv = document.createElement('div');
        container.appendChild(btnDiv);
        overlay.appendChild(container);
        document.body.appendChild(overlay);

        google.accounts.id.renderButton(btnDiv, {
            type: 'standard',
            theme: 'outline',
            size: 'large',
            width: 240,
            text: 'continue_with',
        });

        overlay.addEventListener('click', function (e) {
            if (e.target === overlay) overlay.remove();
        });
    }
</script>
{% endblock %}
